This editor supports **full Markdown** syntax with *Mermaid* diagrams.

## Features
- Real-time preview
- Dark theme
- Resizable panels
- Mermaid diagram support
- Fullscreen mode

## Try a Mermaid Diagram

```mermaid
graph TD
    A[Start] --> B{Is it?}
    B -->|Yes| C[OK]
    C --> D[Rethink]
    D --> B
    B -->|No| E[End]
```
